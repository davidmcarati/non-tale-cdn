<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yerevan Mall - Signature Builder</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f5f7;
    color: #333;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 40px 16px;
  }
  .builder {
    width: 100%;
    max-width: 460px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.08);
    padding: 28px 28px 24px;
  }
  .builder h1 {
    margin: 0 0 4px;
    font-size: 20px;
    color: #111;
  }
  .builder p.sub {
    margin: 0 0 22px;
    font-size: 13px;
    color: #8a8a8a;
  }
  label {
    display: block;
    font-size: 13px;
    font-weight: bold;
    color: #444;
    margin-bottom: 14px;
  }
  label input {
    display: block;
    width: 100%;
    margin-top: 6px;
    padding: 10px 12px;
    font-size: 14px;
    border: 1px solid #d5d7db;
    border-radius: 7px;
    font-weight: normal;
  }
  label input:focus {
    outline: none;
    border-color: #ED0181;
    box-shadow: 0 0 0 3px rgba(237,1,129,0.15);
  }
  button {
    width: 100%;
    margin-top: 6px;
    padding: 12px;
    font-size: 15px;
    font-weight: bold;
    color: #fff;
    background: #ED0181;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover { background: #c9016e; }
</style>
</head>
<body>
  <div class="builder">
    <h1>Email Signature Builder</h1>
    <p class="sub">Fill in the details and generate your signature.</p>
    <form id="sigForm">
      <label>Full Name
        <input type="text" id="name" placeholder="Molly Molyan" required>
      </label>
      <label>Position
        <input type="text" id="position" placeholder="Self Made Fashion Icon" required>
      </label>
      <label>Email
        <input type="email" id="email" placeholder="molly@mail.yerevanmall.am" required>
      </label>
      <label>Phone Number
        <input type="text" id="phone" placeholder="+374 99 999 999" required>
      </label>
      <button type="submit">Generate Signature</button>
    </form>
  </div>

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
