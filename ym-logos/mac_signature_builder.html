<title>Yerevan Mall - Signature Builder</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:Arial,Helvetica,sans-serif; background:#f4f5f7; color:#333;
    display:flex; justify-content:center; align-items:flex-start; min-height:100vh; padding:40px 16px; }
  .builder { width:100%; max-width:460px; background:#fff; border-radius:12px;
    box-shadow:0 6px 24px rgba(0,0,0,0.08); padding:28px 28px 24px; }
  .builder h1 { margin:0 0 4px; font-size:20px; color:#111; }
  .builder p.sub { margin:0 0 22px; font-size:13px; color:#8a8a8a; }
  label { display:block; font-size:13px; font-weight:bold; color:#444; margin-bottom:14px; }
  label input { display:block; width:100%; margin-top:6px; padding:10px 12px; font-size:14px;
    border:1px solid #d5d7db; border-radius:7px; font-weight:normal; }
  label input:focus { outline:none; border-color:#ED0181; box-shadow:0 0 0 3px rgba(237,1,129,0.15); }
  button { width:100%; margin-top:6px; padding:12px; font-size:15px; font-weight:bold; color:#fff;
    background:#ED0181; border:0; border-radius:8px; cursor:pointer; }
  button:hover { background:#c9016e; }
</style>
</head>
<body>
  <div class="builder">
    <h1>Email Signature Builder</h1>
    <p class="sub">Fill in the details and generate your signature.</p>

      <label>Full Name<input type="text" id="name" placeholder="Molly Molyan" required></label>

      <label>Email<input type="email" id="email" placeholder="molly@mail.yerevanmall.am" required></label>
      <label>Phone Number<input type="text" id="phone" placeholder="+374 99 999 999" required></label>
      <button type="submit">Generate Signature</button>
    </form>
  </div>

  function escapeHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

  function makeHeaderImage(name, position){
    return new Promise(function(resolve){
      var logoW=72, logoH=56, gap=18, H=56;
      var nameSize=20, titleSize=14;
      var DPR=2, SS=3, F=DPR*SS;   // retina density x supersample
      var meas=document.createElement("canvas").getContext("2d");
      meas.font="bold "+nameSize+"px Arial";
      var nameW=meas.measureText(name).width;
      meas.font=titleSize+"px Arial";
      var titleW=meas.measureText(position).width;
      var textW=Math.ceil(Math.max(nameW, titleW));
      var W=logoW+gap+textW+2;

      var big=document.createElement("canvas");
      big.width=W*F; big.height=H*F;
      var b=big.getContext("2d");
      var img=new Image();
      img.onload=function(){
        b.imageSmoothingEnabled=true; b.imageSmoothingQuality="high";
        b.drawImage(img, 0, 0, logoW*F, logoH*F);
        b.fillStyle="#000000";
        b.textBaseline="alphabetic";
        b.font="bold "+(nameSize*F)+"px Arial";
        b.fillText(name, (logoW+gap)*F, 25*F);
        b.font=(titleSize*F)+"px Arial";
        b.fillText(position, (logoW+gap)*F, 46*F);
        var out=document.createElement("canvas");
        out.width=W*DPR; out.height=H*DPR;      // retina pixels
        var o=out.getContext("2d");
        o.imageSmoothingEnabled=true; o.imageSmoothingQuality="high";
        o.drawImage(big, 0, 0, W*DPR, H*DPR);
        resolve({url:out.toDataURL("image/png"), w:W, h:H});  // displays at logical size
      };
      img.src=LOGO;
    });
  }

  function buildSignature(header, email, phone){
    var telHref="tel:"+phone.replace(/[^0-9+]/g,"");
    var e=escapeHtml(email), ph=escapeHtml(phone);
    return '' +
'<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;color:#444444;">' +
'  <tr><td><img src="' + header.url + '" alt="" width="' + header.w + '" height="' + header.h + '" border="0" style="display:block;width:' + header.w + 'px;height:' + header.h + 'px;border:0;"></td></tr>' +
'  <tr><td height="14" style="height:14px;font-size:14px;line-height:14px;">&nbsp;</td></tr>' +
'  <tr><td style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#444444;line-height:20px;">' +
'      <span style="font-weight:bold;">Address:</span>&nbsp;34/3, Arshakunyats Str. Yerevan 0015<br>' +
'      <span style="font-weight:bold;">Mob:</span>&nbsp;<a href="' + telHref + '" style="color:#444444;text-decoration:none;">' + ph + '</a><br>' +
'      <span style="font-weight:bold;">Email:</span>&nbsp;<a href="mailto:' + e + '" style="color:#444444;text-decoration:none;">' + e + '</a>' +
'  </td></tr>' +
'  <tr><td height="16" style="height:16px;font-size:16px;line-height:16px;">&nbsp;</td></tr>' +
'  <tr><td><img src="' + BRANDS + '" alt="Yerevan Mall - Kino Park - Captain Kid\'s Treasure Island" width="220" height="145" border="0" style="display:block;width:220px;height:145px;border:0;"></td></tr>' +
'  <tr><td height="14" style="height:14px;font-size:14px;line-height:14px;">&nbsp;</td></tr>' +
'  <tr><td width="620" style="width:620px;border-top:1px solid #333333;padding-top:12px;font-family:Arial,Helvetica,sans-serif;font-size:10px;line-height:15px;color:#8a8a8a;">' +
'      The content of this email is confidential and intended for the recipient specified in the message only. It is strictly forbidden to share any part of this message with any third party without the written consent of the sender. If you received this message by mistake, please reply to this message and follow with its deletion, so that we can ensure such a mistake does not occur in the future.' +
'  </td></tr>' +
'</table>';
  }

  document.getElementById("sigForm").addEventListener("submit", function(ev){
    ev.preventDefault();
    var name=document.getElementById("name").value.trim();
    var position=document.getElementById("position").value.trim();
    var email=document.getElementById("email").value.trim();
    var phone=document.getElementById("phone").value.trim();
    makeHeaderImage(name, position).then(function(header){
      document.open();
      document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Signature</title></head><body style="margin:24px;">' + buildSignature(header, email, phone) + '</body></html>');
      document.close();
    });
  });
